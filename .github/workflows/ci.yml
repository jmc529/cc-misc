name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  teal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua and LuaRocks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4 liblua5.4-dev luarocks

      - name: Install Teal
        run: sudo luarocks install tl

      - name: Install illuaminate
        run: |
          sudo curl -fsSL -o /usr/local/bin/illuaminate \
            https://squiddev.cc/illuaminate/bin/latest/illuaminate-linux-x86_64
          sudo chmod +x /usr/local/bin/illuaminate

      - name: Type check
        run: make check

      - name: Build
        run: make build

      - name: Lint
        run: make lint
